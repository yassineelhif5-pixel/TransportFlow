# Sert le frontend React et relaie /api et /health vers l'API ASP.NET Core.
# Le navigateur ne parle qu'à cette origine : aucune information SQL n'est exposée.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # « expires » (et non add_header) pour conserver les en-têtes de sécurité définis au niveau serveur.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Application monopage : toutes les routes renvoient index.html
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
